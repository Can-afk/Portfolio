            t.classList.toggle("danger", danger);
          }
          const fzE = frzEnd(), jk = ((jamEnd() > now && !g.done) ? Math.floor(now/600) : 0) + "|" + (fzE > now) + (fogEnd() > now) + (g.ht > now) + (g.pk > now) + preSec + (now >= S.startAt + LEAD_IN_MS) + (now >= S.startAt + LEAD_IN_MS + arr(deckOf(S, me())).length*DEAL_STEP_MS + 600);
          if(fzE > now && !g.done) lh += '<div class="banner ice">🧊 Dondun! (' + Math.ceil((fzE - now)/1000) + " sn)</div>";
          iceOn(fzE > now && !g.done);
          if(jk !== lastJam){ lastJam = jk; if(!drag) render(); }
          if(lastSec !== sec){ lastSec = sec; if(sec <= 10 && sec > 0 && !g.done) sfx.tick(); }
          if(g.done && !S.cfg.solo){
            const oleft = Math.max(0, Math.ceil((endAt(S, other()) - now)/1000));
            lh = '<div class="overlay soft"><h2>' + (g.found.length >= dealtOf(S, me()).length ? "Hepsini buldun!" : "Süren doldu!") + '</h2><p class="sub">Rakibin hâlâ oynuyor… (' + oleft + " sn)</p></div>";
          }
          if((!g.done && now >= endAt(S, me())) || (!S.g[other()].done && now >= endAt(S, other()) + 1500)) timeUp();
        }
      }
      if(mate && mate.on === false){
        const gone = now - (mate.off || now), rem = Math.max(0, Math.ceil(RECONNECT_GRACE_SEC - gone/1000));
        lh += '<div class="banner">Rakibin yeniden bağlanıyor… (' + rem + " sn)</div>";
        if(gone > RECONNECT_GRACE_SEC*1000) cancelRound();
      }
    } else if(mate && mate.on === false && S.phase !== "cancelled"){
      lh = '<div class="banner">Rakibin yeniden bağlanıyor…</div>';
    }
  }
  if((sess || obsv) && store.online && !store.online()){ offSince = offSince || Date.now(); if(Date.now() - offSince > 3000) lh += '<div class="banner" style="top:auto;bottom:12px">📶 Bağlantın koptu… yeniden bağlanılıyor</div>'; } else offSince = 0;
  if(S && sess && S.pz && S.phase === "play") lh = '<div class="overlay pz"><div class="big">⏸</div><h1 style="transform:none;margin:6px 0">Oyun durduruldu</h1><p class="sub">Yönetici devam ettirince kaldığın yerden sürer. Süre işlemiyor.</p></div>';
  if(layer.innerHTML !== lh) layer.innerHTML = lh;
}
let offSince = 0;
// anything unexpected is shown on screen, so a photo of the tablet tells us what went wrong
let errShown = 0;
function showErr(e){
  const msg = String(e && (e.message || e.reason && (e.reason.message || e.reason) || e) || "?").slice(0, 160) + (e && e.lineno ? " @" + e.lineno : "");
  if(Date.now() - errShown < 4000) return; errShown = Date.now();
  let el = $("#errbar"); if(!el){ el = document.createElement("div"); el.id = "errbar"; el.style.cssText = "position:fixed;left:8px;bottom:8px;z-index:99;max-width:70vw;background:#b3261e;color:#fff;font:600 12px/1.3 sans-serif;padding:6px 10px;border-radius:8px;pointer-events:none"; document.body.appendChild(el); }
  el.textContent = "Hata: " + msg; clearTimeout(el._t); el._t = setTimeout(() => el.remove(), 15000);
}
window.addEventListener("error", showErr); window.addEventListener("unhandledrejection", showErr);
setInterval(() => { try{ tick(); }catch(e){ showErr(e); } }, 200);

// ---------- input ----------
const acts = {
  goCreate(){ if(nickOk()){ ui.msg = ""; ui.solo = false; view = "create"; render(); } },
  joinQr(){ if(nickOk()) joinRoom(); },
  dropQr(){ ui.qr = false; ui.code = ""; ui.msg = ""; cleanUrl(); render(); },
  goSolo(){ if(nickOk()){ ui.msg = ""; ui.solo = true; view = "create"; render(); } },
  goJoin(){ if(nickOk()){ ui.msg = ""; view = "join"; render(); } },
  goRecs(){ view = "recs"; ui.recs = null; render(); loadRecords(); },
  home(){ view = "home"; ui.msg = ""; render(); },
  setAv(el){ ui.av = +el.dataset.v; localStorage.setItem("bk_av", ui.av); render(); },
  setMode(el){ ui.mode = el.dataset.v; render(); },
  setKind(el){ ui.kind = el.dataset.v; render(); },
  setDiff(el){ ui.diff = +el.dataset.v; render(); },
  setDur(el){ ui.dur = +el.dataset.v; render(); },
  create(){ if(ui.solo) createSolo(); else { createRoom(); render(); } },
  join(){ joinRoom(); },
  quit(){ quitRoom(); },
  goWatch(){ ui.msg = ""; ui.code = ""; view = "watchJoin"; render(); },
  watch(){ startWatch(ui.code); },
  wPause(){ watchPause(true); }, wResume(){ watchPause(false); }, wStart(){ if(!throttled("ws")) startRound(true); },
  exit(el){ if(obsv){ stopWatch(); return; }
    if(!sess){ view = "home"; ui.msg = ""; render(); return; }
    if(S && S.phase === "play" && Date.now() - quitArmed > 3000){ quitArmed = Date.now(); render(); setTimeout(render, 3100); return; }
    quitArmed = 0; quitRoom(); },
  start(){ startRound(); },
  combine(){ combine(); },
  power(el){ usePower(el.dataset.v); },
  unplace(el){ unplace(+el.dataset.k); },
  final(){ ui.recs = null; toFinal(); },
  again(){ ui.recs = null; const solo = S && S.cfg.solo; Promise.resolve(playAgain()).then(() => { if(solo) startRound(); }); },
  settings(){ ui.modal = !ui.modal; renderModal(); },
  toggle(el){ const k = el.dataset.v; prefs[k] = !prefs[k]; savePrefs(); muted = !prefs.sound; if(k === "sound" && prefs.sound) sfx.place(); musicSet(prefs.music); render(); },
  setTheme(el){ if(THEMES[el.dataset.v]){ prefs.theme = el.dataset.v; savePrefs(); render(); } },
  full(){ const d = document.documentElement; try{ if(document.fullscreenElement) document.exitFullscreen(); else (d.requestFullscreen || d.webkitRequestFullscreen).call(d); }catch(e){} }
};
// One place that decides what a tap does.
function handleTap(target){
  const el = target.closest("[data-act]");
  if(prefs.music && !MUSIC.on) musicSet(true); // browsers only allow audio after a touch
  const pick = target.closest(".hand .card"); if(pick && pick.dataset.id !== undefined && (isPortrait() || isMemo(S)) && playing()){ placeCard(+pick.dataset.id); return; }
  if(el && !el.disabled && acts[el.dataset.act]){ if(el.dataset.act !== "combine" && el.dataset.act !== "unplace") sfx.click(); acts[el.dataset.act](el); } keepAwake();
}
// A tap must not get lost when the screen is redrawn between finger-down and finger-up. The browser then sends no "click",
// because the thing under the finger is no longer the very element that was touched - and the screen is redrawn often
// (whenever the rival scores, every second of a countdown ...). So a tap is also recognised by WHAT lies under the finger:
// same button or same card at finger-down and finger-up = a tap, even if the element itself was replaced meanwhile.
let tapDown = null, tapDone = 0;
const tapTarget = t => (t && t.closest) ? (t.closest("[data-act]") || t.closest(".hand .card[data-id]")) : null;
const tapKey = el => el.matches(".hand .card") && !el.dataset.act ? "card:" + el.dataset.id : [el.dataset.act, el.dataset.v || "", el.dataset.k || "", el.dataset.id || "", el.id || ""].join(":");
document.addEventListener("pointerdown", e => { const el = tapTarget(e.target); tapDown = el ? {el, key:tapKey(el), x:e.clientX, y:e.clientY, t:Date.now(), id:e.pointerId} : null; }, true);
document.addEventListener("pointerup", e => { const d = tapDown; tapDown = null;
  if(!d || d.id !== e.pointerId || Date.now() - d.t > 1500 || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 14) return;
  const el = tapTarget(document.elementFromPoint(e.clientX, e.clientY)); if(!el || tapKey(el) !== d.key) return;
  if(d.el === el) return; // the very same element: nothing was replaced, the ordinary click follows
  tapDone = Date.now(); handleTap(el); }, true);
document.addEventListener("click", e => { if(e.target.id === "modal"){ ui.modal = false; renderModal(); return; }
  if(Date.now() - tapDone < 400) return; // this tap was already handled above
  handleTap(e.target); });
document.addEventListener("input", e => { if(e.target.id === "nick") ui.nick = e.target.value; if(e.target.id === "code") ui.code = e.target.value.replace(/\D/g,""); });
document.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.id === "code"){ if(view === "watchJoin") startWatch(ui.code); else joinRoom(); } });

// drag with pointer events (a tap on a card also places it)
let drag = null;
const isPortrait = () => window.matchMedia && window.matchMedia("(orientation:portrait)").matches;
const over = (el, e) => { const r = el.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; };
const moveGhost = e => { drag.g.style.left = (e.clientX - drag.ox) + "px"; drag.g.style.top = (e.clientY - drag.oy) + "px"; };
function cancelDrag(){ if(!drag) return; drag.g.remove(); drag = null; const dz = $("#dropzone"); if(dz) dz.classList.remove("hot"); }
document.addEventListener("pointerdown", e => {
  if(drag && Date.now() - drag.last > 1500) cancelDrag(); // a stale drag gives way to the next touch
  const el = e.target.closest(".hand .card"); if(!el || drag || !playing() || isPortrait() || isMemo(S)) return; // upright phones: tap only, so the hand can scroll
  e.preventDefault();
  const r = el.getBoundingClientRect(), g = el.cloneNode(true);
  g.classList.add("ghost"); g.style.width = r.width + "px"; g.style.height = r.height + "px"; document.body.appendChild(g);
  drag = {id:+el.dataset.id, g, ox:e.clientX - r.left, oy:e.clientY - r.top, sx:e.clientX, sy:e.clientY, moved:false, pid:e.pointerId, last:Date.now()};
  ["pointerup","pointercancel"].forEach(n => el.addEventListener(n, endDrag)); // also heard if the card leaves the page meanwhile
  moveGhost(e); el.classList.add("lifting");
});
document.addEventListener("pointermove", e => {
  if(!drag || e.pointerId !== drag.pid) return;
  drag.last = Date.now(); if(Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) drag.moved = true;
  moveGhost(e); const dz = $("#dropzone"); if(dz) dz.classList.toggle("hot", over(dz, e));
});
function endDrag(e){
  if(!drag || e.pointerId !== drag.pid) return;
  const dz = $("#dropzone"), hit = e.type === "pointerup" && dz && (over(dz, e) || !drag.moved), id = drag.id;
  const gr = drag.moved ? drag.g.getBoundingClientRect() : null;
  drag.g.remove(); drag = null; if(dz) dz.classList.remove("hot");
  if(hit && playing()) placeCard(id, gr); else render();
  if(ui.dirty) render();
}
document.addEventListener("pointerup", endDrag); document.addEventListener("pointercancel", endDrag);

window.addEventListener("resize", fitCards);
// tablet hardening: no scroll, pinch zoom, long-press menu
document.addEventListener("contextmenu", e => e.preventDefault());
["gesturestart","gesturechange","dblclick"].forEach(n => document.addEventListener(n, e => e.preventDefault(), {passive:false}));
document.addEventListener("touchmove", e => { if(e.touches.length > 1 || !e.target.closest(isPortrait() ? ".scroll, .center, .panel, .hand" : ".scroll, .center, .panel")) e.preventDefault(); }, {passive:false});
let wakeLock = null;
async function keepAwake(){ try{ if(!wakeLock && "wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } }catch(e){} }
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible"){ keepAwake(); if(prefs.music && actx) musicSet(true); } else musicSet(false); });

// ---------- boot ----------
// behind everything: little stars that twinkle on the felt and a few very soft lights that drift slowly (transforms and opacity only, so it stays cheap on tablets)
(function makeBackground(){
  const bg = $("#bg"); if(!bg) return; let h = "";
  for(let k=0;k<3;k++) h += '<b style="left:' + [8, 58, 30][k] + "%;top:" + [12, 48, 70][k] + "%;--d:" + [34, 41, 29][k] + "s;--dl:-" + [3, 17, 9][k] + 's"></b>';
  for(let k=0;k<22;k++){ const x = (k*37 + 11) % 97 + 1, y = (k*53 + 7) % 93 + 2, sz = 12 + ((k*13) % 22), d = 2.8 + ((k*7) % 9)*.45, dl = -((k*1.37) % 6);
    h += '<i class="sp" style="left:' + x + "%;top:" + y + "%;--s:" + sz + "px;--d:" + d.toFixed(2) + "s;--dl:" + dl.toFixed(2) + 's"></i>'; }
  bg.innerHTML = h;
})();
async function boot(){
  const wantFirebase = typeof FIREBASE_CONFIG === "object" && FIREBASE_CONFIG && !/[?&]yerel=1/.test(location.search);
  if(wantFirebase){
    try{
      // the Firebase library is embedded in this file (no CDN needed)
      if(typeof firebase === "undefined" || !firebase.database) throw new Error("Firebase kütüphanesi yüklenemedi");
      if(!FIREBASE_CONFIG.databaseURL) throw new Error("config içinde databaseURL eksik");
      store = FirebaseStore();
    }catch(e){
      $("#app").innerHTML = '<div class="center"><h2>Sunucuya bağlanılamadı</h2><p class="sub">Firebase ayarlarını kontrol edip sayfayı yenile.</p><p class="sub" style="font-size:14px">Hata: ' + esc(e && e.message || e) + "</p></div>";
      return;
    }
  } else store = LocalStore();
  mainStore = store;
  try{ store.cleanup(); }catch(e){}
  let saved = null; try{ saved = JSON.parse(sessionStorage.getItem("bk_sess")); }catch(e){}
  const m = location.search.match(/[?&]oda=(\d{4})(?:&|$)/); // opened from a QR code
  if(m && !(saved && saved.code === m[1])){ saved = null; sessionStorage.removeItem("bk_sess"); ui.code = m[1]; ui.qr = true; }
  if(saved && saved.code && saved.role) enter(saved.code, saved.role);
  const w = location.search.match(/[?&]izle=(\d{4})(?:&|$)/); // admin link
  if(w && !sess){ ui.qr = false; startWatch(w[1]); }
  render();
  if(!sess && !obsv && !ui.qr) tryRejoin(0);
}
boot();
