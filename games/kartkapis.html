<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>KARTKAPIŞ</title>
<style>
:root{--ink:#2b2118;--cream:#fff6e0;--cream2:#ffe9b8;--wood:#8a5a2b;--wood2:#6f4520;--felt:#1f8a63;--felt2:#17704f;--mute:#7a6a55;
  --ok:#2ecc71;--bad:#ff5d5d;--sun:#ffd23f;--acc:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
  background:var(--wood)}
input{user-select:text;-webkit-user-select:text;touch-action:manipulation}
/* wooden table top */
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:14px 18px 64px;
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 46px,rgba(255,255,255,.05) 46px 48px,transparent 48px 120px),
    linear-gradient(180deg,#a06a35 0%,var(--wood) 45%,var(--wood2) 100%)}
h1{font-size:clamp(34px,5.4vw,64px);margin:0 0 6px;font-weight:900;color:var(--sun);letter-spacing:.01em;
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-2deg)}
h2{font-size:clamp(22px,2.9vw,34px);margin:0 0 12px;font-weight:900;color:var(--cream);text-shadow:0 3px 0 var(--ink)}
.sub{color:var(--cream2);font-size:clamp(15px,1.7vw,20px);margin:0 0 20px;font-weight:700;text-shadow:0 2px 0 rgba(43,33,24,.55)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
/* chunky game buttons */
.btn{appearance:none;border:3px solid var(--ink);background:var(--cream);color:var(--ink);font:inherit;font-weight:900;
  font-size:clamp(17px,2vw,24px);padding:14px 26px;border-radius:18px;min-height:62px;cursor:pointer;
  box-shadow:0 6px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--acc)}
.btn.ghost{background:#e9d3a6}
.btn[disabled]{opacity:.5;pointer-events:none;box-shadow:0 3px 0 var(--ink);transform:translateY(3px)}
.field{background:var(--cream);border:3px solid var(--ink);color:var(--ink);font:inherit;font-weight:800;font-size:clamp(18px,2.2vw,26px);
  padding:12px 18px;border-radius:18px;min-height:62px;text-align:center;width:min(420px,80vw);outline:none;box-shadow:inset 0 4px 0 rgba(43,33,24,.12)}
.field:focus{background:#fff}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0 18px}
.chip{border:3px solid var(--ink);background:var(--cream);color:var(--ink);font:inherit;font-weight:800;font-size:clamp(14px,1.6vw,19px);
  padding:10px 18px;border-radius:999px;min-height:52px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.chip.on{background:var(--c,var(--sun));transform:translateY(3px) rotate(-1.5deg);box-shadow:0 1px 0 var(--ink)}
.label{color:var(--cream2);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-top:6px;font-weight:900;text-shadow:0 2px 0 rgba(43,33,24,.5)}
.code{font-size:clamp(64px,13vw,150px);font-weight:900;letter-spacing:.1em;font-variant-numeric:tabular-nums;line-height:1.05;color:var(--cream);
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink)}
.msg{color:#fff;background:var(--bad);border:3px solid var(--ink);border-radius:12px;padding:6px 14px;margin-top:14px;font-weight:800}
.msg:empty{visibility:hidden}
.badge{position:fixed;left:12px;bottom:12px;font-size:11px;letter-spacing:.12em;color:var(--ink);background:var(--sun);padding:5px 9px;border-radius:8px;font-weight:900;z-index:5;border:2px solid var(--ink)}
#chrome{position:fixed;right:12px;bottom:10px;display:flex;gap:8px;z-index:30}
#chrome button{min-width:52px;height:44px;border-radius:12px;border:3px solid var(--ink);background:var(--cream);color:var(--ink);font:inherit;font-size:12px;font-weight:900;box-shadow:0 3px 0 var(--ink)}
/* ---- play ---- */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.meta{color:var(--cream);font-size:clamp(13px,1.5vw,18px);font-weight:800;text-shadow:0 2px 0 rgba(43,33,24,.6)}
.meta b{color:var(--sun)}
.timer{font-size:clamp(50px,8.4vw,96px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink);
  background:var(--cream);border:4px solid var(--ink);border-radius:22px;padding:2px 26px 4px;box-shadow:0 7px 0 var(--ink);transform:rotate(-1.5deg)}
.timer.danger{background:var(--bad);color:#fff;animation:wobble .5s infinite}
.score{justify-self:end;display:flex;flex-direction:column;align-items:flex-end}
.score .n{min-width:clamp(84px,11vw,130px);height:clamp(84px,11vw,130px);border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 10px;
  font-size:clamp(34px,5vw,60px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;background:var(--sun);border:4px solid var(--ink);
  box-shadow:0 6px 0 var(--ink),inset 0 0 0 5px rgba(255,255,255,.45)}
.streak{color:var(--cream);font-weight:900;font-size:clamp(13px,1.5vw,18px);min-height:1.3em;margin-top:8px;text-shadow:0 2px 0 var(--ink)}
/* felt play mat */
.table{flex:1;min-height:0;display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin:14px 0;padding:14px;
  border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink),inset 0 0 0 6px var(--felt2),inset 0 0 60px rgba(0,0,0,.25);
  background:radial-gradient(circle at 50% 40%,#28a476 0%,var(--felt) 60%,var(--felt2) 100%);transition:filter .15s}
.table.hot{filter:brightness(1.15)}
.slot{border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#d9f5e8;font-weight:800;
  font-size:clamp(13px,1.5vw,17px);text-align:center;padding:10px;min-height:110px;border:3px dashed rgba(255,255,255,.45)}
.slot .who{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;font-weight:900;color:#fff}
.slot .card{width:min(100%,360px);min-height:110px;font-size:clamp(19px,2.7vw,32px);transform:rotate(-2deg)}
.slot:last-child .card{transform:rotate(2deg)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:200px}
.mid .meta{color:#fff}
.plus{font-size:54px;color:#fff;line-height:.8;font-weight:900;text-shadow:0 4px 0 var(--ink)}
#combine{min-width:200px;min-height:80px;font-size:clamp(21px,2.5vw,30px);background:var(--sun)}
#combine.wait{background:#e9d3a6;font-size:clamp(14px,1.6vw,18px)}
#combine.nudge{animation:wobble .6s infinite}
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:13px 10px}
/* playing cards */
.card{position:relative;background:var(--cream);border:3px solid var(--ink);border-radius:16px;min-height:82px;padding:16px 12px 10px;
  display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:clamp(15px,1.75vw,21px);line-height:1.15;
  color:var(--ink);cursor:grab;word-break:break-word;box-shadow:0 6px 0 var(--ink);overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:11px;background:var(--c,var(--sun));border-bottom:3px solid var(--ink)}
.hand .card:nth-child(odd){transform:rotate(-1.2deg)}.hand .card:nth-child(even){transform:rotate(1deg)}
.card.long{font-size:clamp(12px,1.3vw,16px)}
.card.lifting{opacity:.3}
.card.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 16px 0 rgba(43,33,24,.35);transform:scale(1.08) rotate(-5deg)!important;margin:0}
.card.locked{cursor:default;background:#f3e3bd}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px) rotate(-3deg)}40%{transform:translateX(14px) rotate(3deg)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) scale(1.04)}}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6) rotate(-3deg);opacity:0;pointer-events:none;z-index:60;color:var(--ink);
  background:var(--cream);border:4px solid var(--ink);border-radius:26px;padding:20px 34px;text-align:center;max-width:86vw;box-shadow:0 9px 0 var(--ink);
  transition:opacity .12s,transform .18s cubic-bezier(.3,1.6,.5,1)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
#toast.ok{background:#d9ffe6}#toast.bad{background:#ffe1dc}
#toast b{display:block;font-size:clamp(26px,3.8vw,46px);font-weight:900}
#toast.ok b{color:#12894a}#toast.bad b{color:#d92b2b}
#toast span{display:block;margin-top:6px;font-size:clamp(16px,2vw,24px);color:var(--mute);font-weight:800}
#toast em{font-style:normal;color:var(--ink);font-weight:900}
.overlay{position:fixed;inset:0;background:rgba(58,36,16,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:40;text-align:center;padding:24px}
.overlay .big{font-size:clamp(110px,24vw,260px);font-weight:900;line-height:1;color:var(--sun);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 12px 0 var(--ink)}
.banner{position:fixed;left:50%;top:10px;transform:translateX(-50%) rotate(-1deg);background:var(--sun);border:3px solid var(--ink);color:var(--ink);
  padding:10px 18px;border-radius:14px;font-weight:900;z-index:45;font-size:clamp(14px,1.7vw,20px);box-shadow:0 5px 0 var(--ink)}
/* ---- results ---- */
.scroll{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:0 8px 10px 0}
.res{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{position:relative;background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:10px 14px 10px 24px;box-shadow:0 4px 0 var(--ink);overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:11px;background:var(--c,var(--sun));border-right:3px solid var(--ink)}
.item.miss{background:#eadbb9;border-style:dashed}
.item .eq{font-weight:900;font-size:clamp(15px,1.8vw,21px)}
.item .why{color:var(--mute);font-size:clamp(13px,1.45vw,17px);margin-top:3px;line-height:1.3;font-weight:700}
.hd{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:6px}
.hd .n{display:inline-flex;align-items:center;justify-content:center;min-width:110px;height:110px;border-radius:50%;padding:0 12px;font-size:clamp(34px,5vw,56px);font-weight:900;
  background:var(--sun);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink),inset 0 0 0 5px rgba(255,255,255,.45)}
.hd .label{margin:0 0 6px}
.sect{color:var(--cream);font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin:14px 0 8px;font-weight:900;text-shadow:0 2px 0 var(--ink)}
table.rec{border-collapse:separate;border-spacing:0;width:min(900px,96vw);font-size:clamp(14px,1.7vw,20px);background:var(--cream);border:3px solid var(--ink);
  border-radius:16px;overflow:hidden;box-shadow:0 6px 0 var(--ink);font-weight:800;margin-top:6px}
table.rec td,table.rec th{padding:8px 14px;border-bottom:2px solid rgba(43,33,24,.15);text-align:left}
table.rec th{background:var(--sun);font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-bottom:3px solid var(--ink)}
table.rec td.s{font-weight:900;text-align:right}table.rec th.s{text-align:right}
#rotate{display:none;position:fixed;inset:0;background:var(--wood);color:var(--cream);z-index:99;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:900;padding:30px}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
@media (max-height:600px){.card{min-height:80px}.slot{min-height:90px}.timer{font-size:48px}.score .n{min-width:72px;height:72px;font-size:30px}.hd .n{min-width:80px;height:80px}}

/* ---- v2: versus mode, avatars, logo ---- */
.logo{width:min(440px,52vw);height:auto;margin-bottom:2px;filter:drop-shadow(0 6px 0 rgba(43,33,24,.35))}
.av{width:54px;height:54px;flex:none;display:block}
.av.xl{width:clamp(90px,13vw,150px);height:clamp(90px,13vw,150px)}
.avs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0 14px}
.avb{appearance:none;border:0;background:none;padding:0;border-radius:50%;cursor:pointer;transition:transform .1s;opacity:.7}
.avb .av{width:clamp(56px,7.2vw,80px);height:clamp(56px,7.2vw,80px)}
.avb.on{opacity:1;transform:scale(1.2) rotate(-6deg);filter:drop-shadow(0 5px 0 var(--ink))}
.ghostav{border-radius:50%;border:5px dashed rgba(255,246,224,.6);display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:900;color:rgba(255,246,224,.7)}
.vs{display:flex;align-items:center;justify-content:center;gap:clamp(18px,4vw,60px);margin:6px 0 14px}
.vs .who{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--cream);font-size:clamp(18px,2.4vw,28px);text-shadow:0 3px 0 var(--ink)}
.vs .who.win .av{filter:drop-shadow(0 0 0 #ffd23f) drop-shadow(0 0 14px #ffd23f);transform:scale(1.12) rotate(-4deg)}
.vs .fs{font-size:clamp(34px,5vw,60px);font-weight:900;color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.vsx{font-size:clamp(30px,4.6vw,56px);font-weight:900;color:var(--bad);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-8deg)}
.side{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.side.r{align-items:flex-end}
.plate{display:flex;align-items:center;gap:10px;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:4px 18px 4px 4px;box-shadow:0 5px 0 var(--ink);max-width:100%}
.plate.me{background:var(--sun)}
.plate .nm{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22vw}
.plate .pt{font-size:clamp(24px,3vw,36px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.plate.big .av{width:70px;height:70px}.plate.big .pt{font-size:clamp(30px,4vw,48px)}
.pips{display:inline-flex;gap:4px;vertical-align:middle}
.pips i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:rgba(255,246,224,.35);display:inline-block}
.pips i.on{background:var(--ok)}
.streak{color:var(--sun)!important}
.table{grid-template-columns:1fr auto 1fr;margin:10px 0 12px;padding:10px 14px}
.slot{min-height:96px}.slot .card{min-height:92px;font-size:clamp(17px,2.3vw,28px)}
.overlay.soft{background:rgba(58,36,16,.72);top:auto;bottom:0;height:46%;border-top:4px solid var(--ink)}
.hd{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center}
.rcol{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
@media (max-height:640px){.logo{width:min(300px,40vw)}.avb .av{width:52px;height:52px}}

/* ---- v3: card pictograms, exit button, burned pips ---- */
.card{gap:8px;padding:16px 10px 8px}
.card .ic{flex:none;font-size:clamp(22px,2.6vw,32px);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-weight:400}
.card .tx{min-width:0}
.slot .card .ic{font-size:clamp(30px,3.6vw,46px)}
.pips i.off{background:var(--bad)}
#exitBtn{padding:0 12px;white-space:nowrap}
#exitBtn.armed{background:var(--bad);color:#fff}
#toast.bad span em{display:inline}

/* ---- v4: blue theme, settings, icon buttons, joy animation ---- */
:root{--blue:#2f6fe4;--blue2:#1f4fc0;--navy:#142a6e}
html,body{background:var(--blue2)}
#app{background-color:var(--blue);
  background-image:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.13) 0 9px,transparent 10px),
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.08) 0 5px,transparent 6px),
    linear-gradient(135deg,rgba(255,255,255,.06) 25%,transparent 25% 50%,rgba(255,255,255,.06) 50% 75%,transparent 75%),
    linear-gradient(180deg,#4a8bff 0%,var(--blue) 45%,var(--blue2) 100%);
  background-size:84px 84px,84px 84px,168px 168px,100% 100%;
  background-position:0 0,42px 42px,0 0,0 0}
.table{background:radial-gradient(circle at 50% 40%,#2b55cf 0%,#1c3da6 60%,var(--navy) 100%);box-shadow:0 8px 0 var(--ink),inset 0 0 0 6px #17338f,inset 0 0 60px rgba(0,0,0,.28)}
.slot{color:#dbe6ff}
.overlay{background:rgba(14,28,78,.9)}.overlay.soft{background:rgba(14,28,78,.78)}
#rotate{background:var(--blue2)}
.btn.ghost{background:#dfe8ff}
#chrome button{display:flex;align-items:center;justify-content:center}
#setBtn,#fullBtn{min-width:48px;width:48px;padding:0}
#modal:empty{display:none}
#modal{position:fixed;inset:0;z-index:80;background:rgba(14,28,78,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.panel{background:var(--cream);border:4px solid var(--ink);border-radius:26px;box-shadow:0 10px 0 var(--ink);padding:20px 26px 22px;width:min(520px,92vw);max-height:92vh;overflow:auto;touch-action:pan-y}
.panel h2{color:var(--ink);text-shadow:none;margin:0 0 12px;text-align:center}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:2px dashed rgba(43,33,24,.18);font-weight:900;font-size:clamp(16px,1.9vw,21px)}
.setrow small{display:block;font-weight:700;color:var(--mute);font-size:13px}
.sw{appearance:none;flex:none;width:86px;height:46px;border-radius:999px;border:3px solid var(--ink);background:#d9cfb8;position:relative;cursor:pointer;box-shadow:0 4px 0 var(--ink);font:inherit}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);transition:left .15s}
.sw.on{background:var(--ok)}.sw.on::after{left:44px}
.panel .row{margin-top:16px}
/* joy: the avatar jumps and spins a little, sparkles fly */
.plate{position:relative}
.plate.joy .av{animation:joy .9s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--jd,0ms)}
.plate.joy::before,.plate.joy::after{content:"★";position:absolute;left:22px;top:6px;font-size:22px;color:var(--sun);-webkit-text-stroke:1.5px var(--ink);pointer-events:none;animation:spark .9s ease-out both;animation-delay:var(--jd,0ms)}
.plate.joy::after{animation-name:spark2;font-size:16px}
@keyframes joy{0%{transform:translateY(0) scale(1)}18%{transform:translateY(4px) scale(1.15,.8)}42%{transform:translateY(-26px) scale(.92,1.14) rotate(-14deg)}62%{transform:translateY(-10px) scale(1.05) rotate(12deg)}80%{transform:translateY(2px) scale(1.12,.88)}100%{transform:translateY(0) scale(1)}}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(-30px,-42px) scale(1.3) rotate(-40deg)}}
@keyframes spark2{0%{opacity:0;transform:translate(0,0) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(38px,-34px) scale(1.4) rotate(50deg)}}
.vs .who.win .av{animation:dance 1s ease-in-out infinite}
@keyframes dance{0%,100%{transform:scale(1.1) rotate(-6deg) translateY(0)}50%{transform:scale(1.16) rotate(6deg) translateY(-12px)}}
body.noanim *,body.noanim *::before,body.noanim *::after{animation:none!important;transition:none!important}
body.noicons .card .ic{display:none}

/* ---- v6: everything sits straight (no tilted cards or text) ---- */
h1,.timer,.vsx{transform:none}
.hand .card:nth-child(odd),.hand .card:nth-child(even),.slot .card,.slot:last-child .card{transform:none}
.card.ghost{transform:scale(1.08)!important}
.chip.on{transform:translateY(3px)}
.avb.on{transform:scale(1.2)}
.banner{transform:translateX(-50%)}
#toast{transform:translate(-50%,-50%) scale(.6)}
#toast.show{transform:translate(-50%,-50%) scale(1)}
.vs .who.win .av{transform:scale(1.12)}
.timer.danger{animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.06)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

/* ---- v7: QR code in the lobby ---- */
.joinbox{display:flex;align-items:center;justify-content:center;gap:clamp(16px,3vw,40px);flex-wrap:wrap}
.qr{background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:8px;width:clamp(120px,17vw,190px);line-height:0}
.qr svg{width:100%;height:auto;display:block}
.qrcap{font-size:13px;font-weight:900;color:var(--cream);text-shadow:0 2px 0 var(--ink);margin-top:8px;max-width:190px;line-height:1.2}

/* ---- v8: bigger hand, compact combine area ---- */
.table{flex:0 0 auto;margin:8px 0 10px;padding:8px 12px;gap:12px;border-radius:22px}
.slot{min-height:0;height:clamp(116px,22vh,190px);padding:8px;border-radius:16px}
.slot .card{min-height:0;height:100%;width:100%;font-size:clamp(19px,2.6vw,32px)}
.slot .card .ic{font-size:clamp(34px,4.4vw,56px)}
.mid{flex-direction:row;gap:12px;min-width:0}
.plus{font-size:46px}
#combine{min-width:clamp(150px,17vw,200px);min-height:76px}
.hand{flex:1;min-height:0;grid-template-rows:repeat(3,minmax(0,1fr));gap:12px 10px}
.hand .card{min-height:0;font-size:clamp(17px,2.15vw,27px);padding:18px 12px 8px}
.hand .card.long{font-size:clamp(14px,1.6vw,20px)}
.hand .card .ic{font-size:clamp(28px,3.4vw,44px)}

/* ---- v11: combine area about twice as tall; hand rows give up the space ---- */
.slot{height:clamp(200px,40vh,360px)}
.slot .card{flex-direction:column;gap:10px;font-size:clamp(24px,3.4vw,44px)}
.slot .card .ic{font-size:clamp(46px,6.4vw,84px)}
#combine{min-height:92px;font-size:clamp(22px,2.7vw,32px)}
.plus{font-size:56px}
.hand{gap:10px}
.hand .card{font-size:clamp(15px,1.8vw,22px);padding:15px 10px 6px;gap:6px}
.hand .card.long{font-size:clamp(12px,1.35vw,17px)}
.hand .card .ic{font-size:clamp(22px,2.6vw,34px)}

/* ---- v12: powers ---- */
.pwrow{display:flex;gap:8px;margin-top:2px}
.pw{appearance:none;border:3px solid var(--ink);background:var(--bad);color:#fff;font:inherit;font-weight:900;font-size:clamp(14px,1.6vw,19px);padding:8px 14px;border-radius:14px;
  min-height:46px;box-shadow:0 4px 0 var(--ink);cursor:pointer;animation:beat .7s infinite;white-space:nowrap}
.pw[data-v=time]{background:var(--ok);color:var(--ink)}
.pw:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hand.jam .card{animation:jamwob .3s infinite alternate}
.hand.jam .card:nth-child(even){animation-direction:alternate-reverse}
@keyframes jamwob{from{transform:rotate(-4deg) scale(.96)}to{transform:rotate(4deg) scale(1.02)}}
.mid{flex-direction:column;gap:14px}
.midrow{display:flex;align-items:center;gap:12px}
.pwrow{margin-top:0;flex-wrap:wrap;justify-content:center}

/* ---- v13: three colour themes + animated background ---- */
body{--bg1:#4a8bff;--bg2:#2f6fe4;--bg3:#1f4fc0;--mat1:#2b55cf;--mat2:#1c3da6;--mat3:#142a6e;--ovl:14,28,78;--ghost:#dfe8ff}
body.theme-candy{--bg1:#ff8ac2;--bg2:#e0559f;--bg3:#8f3fd0;--mat1:#8a4be0;--mat2:#5f2db0;--mat3:#3c1b7c;--ovl:58,18,90;--ghost:#ffe3f3}
body.theme-forest{--bg1:#63d28c;--bg2:#2f9e62;--bg3:#167552;--mat1:#218a63;--mat2:#15674a;--mat3:#0c4433;--ovl:8,50,36;--ghost:#e2f7e8}
html,body{background:var(--bg3)}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%)}
#bg i{position:absolute;left:var(--x);bottom:-180px;width:var(--s);height:var(--s);background:rgba(255,255,255,.11);border-radius:50%;will-change:transform;
  animation:rise var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes rise{from{transform:translateY(0) rotate(0)}to{transform:translateY(-135vh) rotate(200deg)}}
body.theme-candy #bg i{border-radius:24%;animation-name:spinrise}
@keyframes spinrise{from{transform:translateY(0) rotate(0)}to{transform:translateY(-135vh) rotate(540deg)}}
body.theme-forest #bg i{border-radius:70% 0 70% 0;bottom:auto;top:-180px;animation-name:leaf}
@keyframes leaf{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(60px,70vh) rotate(160deg)}100%{transform:translate(-30px,140vh) rotate(330deg)}}
body.noanim #bg i{display:none}
#app{z-index:1;background-color:transparent;
  background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.10) 0 9px,transparent 10px),radial-gradient(circle at 50% 50%,rgba(255,255,255,.07) 0 5px,transparent 6px);
  background-size:84px 84px,84px 84px;background-position:0 0,42px 42px}
.table{background:radial-gradient(circle at 50% 40%,var(--mat1) 0%,var(--mat2) 60%,var(--mat3) 100%);box-shadow:0 8px 0 var(--ink),inset 0 0 0 6px var(--mat2),inset 0 0 60px rgba(0,0,0,.28)}
.overlay{background:rgba(var(--ovl),.9)}.overlay.soft{background:rgba(var(--ovl),.78)}
#modal{background:rgba(var(--ovl),.72)}
#rotate{background:var(--bg3)}
.btn.ghost{background:var(--ghost)}
.themes{display:flex;gap:10px}
.thb{appearance:none;width:52px;height:46px;border-radius:14px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;opacity:.75}
.thb.on{opacity:1;transform:translateY(-3px);box-shadow:0 7px 0 var(--ink);outline:3px solid var(--sun);outline-offset:2px}

/* ---- v14: card pictures and avatars keep moving ---- */
.card .ic{display:inline-block;transform-origin:50% 80%;animation:icbob 1.6s ease-in-out infinite}
.hand .card:nth-child(3n+1) .ic{animation-name:icwig;animation-duration:1.9s}
.hand .card:nth-child(3n+2) .ic{animation-name:icpulse;animation-duration:1.4s}
.hand .card:nth-child(even) .ic{animation-delay:-.7s}
.hand .card:nth-child(4n) .ic{animation-delay:-1.1s}
.slot .card .ic{animation-name:icjump;animation-duration:1.1s}
@keyframes icbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes icwig{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes icpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes icjump{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-14px) scale(1.08) rotate(-8deg)}60%{transform:translateY(0) scale(1.1,.92)}}
.av.xl,.avb.on .av{animation:avfloat 2.2s ease-in-out infinite}
.vs .who:nth-child(3) .av.xl{animation-delay:-1.1s}
@keyframes avfloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.vs .who.win .av{animation:dance 1s ease-in-out infinite}
.logo{animation:logopop 3s ease-in-out infinite}
@keyframes logopop{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
#setBtn svg{animation:gear 9s linear infinite}
@keyframes gear{to{transform:rotate(360deg)}}

/* ---- v15: larger text on the hand cards ---- */
.hand .card{font-size:clamp(18px,2.25vw,28px);line-height:1.08;padding:14px 8px 5px;gap:6px}
.hand .card.long,.hand .card.xlong{font-size:clamp(18px,2.25vw,28px)} /* long texts are shrunk to fit by fitCards() */
.hand .card .ic{font-size:clamp(20px,2.3vw,30px)}

/* ---- v16: phones play upright (portrait) ---- */
@media (orientation:portrait){
  #rotate{display:none!important}
  #app{padding:10px 10px 62px}
  .center{justify-content:safe center;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
  .logo{width:min(78vw,380px)}
  .avs{gap:8px;max-width:96vw}
  .avb .av{width:clamp(48px,17vw,84px);height:clamp(48px,17vw,84px)}
  .field{width:min(88vw,420px)}
  .center > .row{flex-direction:column;gap:10px;width:100%}
  .center > .row .btn{width:min(88vw,420px)}
  .chips{gap:8px}.chip{padding:9px 14px;min-height:46px}
  .code{font-size:clamp(60px,23vw,130px)}
  .joinbox{flex-direction:column;gap:10px}
  .qr{width:clamp(130px,40vw,200px)}
  .vs{gap:12px}.av.xl{width:clamp(80px,26vw,140px);height:clamp(80px,26vw,140px)}
  .vsx{font-size:clamp(24px,8vw,44px)}
  /* play screen */
  .top{grid-template-columns:1fr 1fr;gap:6px 8px}

  .side{grid-row:2}.side.r{grid-column:2}

  .slot{height:clamp(84px,15vh,150px);padding:5px;font-size:13px}
  .slot .card{font-size:clamp(15px,4.8vw,24px);gap:4px}

  #combine{min-height:54px;min-width:44vw;font-size:clamp(18px,5.4vw,26px)}

  .hand{grid-template-columns:repeat(2,1fr)!important;grid-template-rows:repeat(var(--prow,7),minmax(58px,1fr));gap:8px;
    overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:0 2px 6px;overscroll-behavior:contain}
  .hand .card{cursor:pointer}
  .hand .card,.hand .card.long,.hand .card.xlong{font-size:clamp(14px,4.4vw,21px);padding:11px 6px 3px;border-radius:12px;box-shadow:0 4px 0 var(--ink);gap:5px}
  .card::before{height:8px}
  .hand .card .ic{font-size:clamp(17px,5vw,24px)}
  /* results, leaderboard, overlays */
  .hd{grid-template-columns:1fr;gap:8px}.res{grid-template-columns:1fr}
  table.rec{font-size:13px}table.rec td,table.rec th{padding:6px 7px}
  #toast{max-width:94vw;padding:14px 16px;border-radius:20px}
  #toast b{font-size:clamp(22px,7vw,34px)}#toast span{font-size:clamp(14px,4.2vw,20px)}
  .overlay .big{font-size:clamp(100px,40vw,220px)}
  .panel{width:94vw;padding:16px 16px 18px}
  .setrow{font-size:16px}
  #exitBtn{font-size:11px;padding:0 9px}
  .badge{font-size:9px;padding:3px 6px}
}

/* ---- v17: the screen is a game table seen from above: wooden rim + felt in the theme colour ---- */
html,body{background:#5a3718}
body{background:
  repeating-linear-gradient(92deg,rgba(0,0,0,.10) 0 2px,transparent 2px 38px,rgba(255,255,255,.05) 38px 40px,transparent 40px 97px),
  linear-gradient(180deg,#a56d38 0%,#7d4d24 50%,#5a3718 100%)}

  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px),
    repeating-linear-gradient(-45deg,rgba(0,0,0,.045) 0 2px,transparent 2px 5px),
    radial-gradient(ellipse at 50% 38%,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  box-shadow:inset 0 0 0 5px rgba(255,255,255,.10),inset 0 10px 26px rgba(0,0,0,.35),inset 0 0 110px rgba(0,0,0,.42),0 0 0 3px rgba(255,255,255,.12)}

.card{box-shadow:0 6px 0 var(--ink),0 14px 14px rgba(0,0,0,.22)}
.table{box-shadow:0 8px 0 var(--ink),0 18px 22px rgba(0,0,0,.25),inset 0 0 0 6px var(--mat2),inset 0 0 60px rgba(0,0,0,.28)}
#rotate{background:#5a3718}
@media (orientation:portrait){
  #bg{inset:7px;border-radius:22px;border-width:3px}
  #app{padding:16px 15px 70px}
  #chrome{right:16px;bottom:16px}.badge{left:16px;bottom:18px}

}
@media (orientation:landscape){.slot{height:clamp(180px,35vh,320px)}#app{padding:24px 30px 74px}}

/* ---- v18: round timer with a progress ring; thicker table rim ---- */
.timer{position:relative;width:clamp(96px,12.5vw,136px);height:clamp(96px,12.5vw,136px);padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:clamp(28px,3.9vw,44px);background:var(--cream);border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink),0 14px 16px rgba(0,0,0,.25);transform:none}
.timer svg{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px)}
.timer .trk{fill:none;stroke:rgba(43,33,24,.13);stroke-width:9}
.timer .arc{fill:none;stroke:#1fa64a;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .25s linear}
.timer #ttxt{position:relative;font-variant-numeric:tabular-nums;line-height:1;transition:color .25s}
.timer.danger{background:var(--bad);animation:beat .5s infinite}
.timer.danger .trk{stroke:rgba(255,255,255,.28)}
#bg{inset:26px;border-radius:34px;box-shadow:inset 0 0 0 5px rgba(255,255,255,.10),inset 0 12px 28px rgba(0,0,0,.4),inset 0 0 110px rgba(0,0,0,.42),0 0 0 4px rgba(0,0,0,.35),0 0 0 9px rgba(255,255,255,.10)}
body{background:
  radial-gradient(ellipse at 50% 50%,transparent 62%,rgba(0,0,0,.28) 100%),
  repeating-linear-gradient(92deg,rgba(0,0,0,.12) 0 2px,transparent 2px 38px,rgba(255,255,255,.06) 38px 40px,transparent 40px 97px),
  linear-gradient(180deg,#b0763d 0%,#84522a 50%,#5a3718 100%)}
@media (orientation:landscape){

}

/* ---- v19: more powers ---- */
.pw{background:var(--ok);color:var(--ink);font-size:clamp(13px,1.45vw,17px);padding:7px 11px}
.pw.atk{background:var(--bad);color:#fff}
.pw[data-v=time]{background:var(--ok);color:var(--ink)}
.pwrow{gap:7px}
.hand.frz .card{filter:saturate(.35) brightness(1.08);background:#dff3ff;border-color:#3a6ea5;box-shadow:0 6px 0 #3a6ea5;cursor:not-allowed}
.hand.frz .card .ic{animation:none}
.hand.fog .card .tx{filter:blur(9px);opacity:.55}
.hand.fog .card .ic{opacity:0}
.hand .card.hint{background:#fff3a6;box-shadow:0 6px 0 var(--ink),0 0 0 5px var(--sun),0 0 22px 8px rgba(255,210,63,.9);animation:beat .5s infinite;z-index:2}
.banner.ice{background:#bfe6ff;top:auto;bottom:50%}
@media (orientation:portrait){.pw{font-size:12px;padding:6px 8px;min-height:40px}}

/* ---- v20: memory mode ---- */
.card.gone{visibility:hidden;animation:none}
.hand.memo .card{cursor:pointer}
.card.back{background:repeating-linear-gradient(45deg,#24439f 0 12px,#2c50b8 12px 24px);animation:none}
.hand.flip .card.back{animation:flipin .3s ease-out}
.card.back::before{background:var(--sun)}
.card.back .ic,.card.back .tx{visibility:hidden}
.card.back::after{content:"?";position:absolute;left:0;right:0;top:54%;transform:translateY(-50%);text-align:center;font-size:clamp(26px,3.4vw,44px);font-weight:900;color:var(--sun);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.hand .card.back.hint{background:repeating-linear-gradient(45deg,#d9a400 0 12px,#ffd23f 12px 24px)}
@keyframes flipin{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
.banner.memo{top:auto;bottom:calc(50% - 120px);background:var(--sun);font-size:clamp(18px,2.4vw,28px)}
.hand.memo ~ * #combine,.table #combine[disabled]{opacity:.75}

/* ---- v21: memory mode uses picture cards ---- */
.card.shape{padding:14px 6px 6px}
.card .shp{height:100%;max-height:100%;width:auto;max-width:100%;display:block;filter:drop-shadow(0 3px 0 rgba(43,33,24,.25))}
.slot .card.shape{padding:22px 10px 12px}
.slot .card .shp{height:86%;animation:icpulse 1.2s ease-in-out infinite}

.table.memo #combine{opacity:1;background:var(--cream);font-size:clamp(18px,2.2vw,26px)}

.memobar{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:10px 0 12px;min-height:54px}
.memobar b{background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:8px 22px;font-size:clamp(17px,2.1vw,25px);box-shadow:0 5px 0 var(--ink)}

.card .pic{font-size:clamp(44px,11vh,120px);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-weight:400}
.card.back .pic{visibility:hidden}
.hand.memo .card.picked{box-shadow:0 6px 0 var(--ink),0 0 0 5px var(--sun);transform:translateY(-4px);animation:flipin .25s ease-out}

@media (orientation:portrait){
  .hand.memo{grid-template-columns:repeat(var(--pcols,3),1fr)!important;grid-template-rows:repeat(var(--prow,4),minmax(64px,1fr));gap:8px}

}
.logo{width:min(520px,58vw);height:auto;-webkit-user-drag:none;user-select:none}
@media (orientation:portrait){.logo{width:min(84vw,420px)}}

html,body,button,input{font-family:"Kapis",ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif}
/* ---- v23: home menu tiles and the room set-up panel ---- */
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:min(940px,94%);margin-top:16px}
.tile{appearance:none;border:4px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:22px;padding:14px 10px 12px;cursor:pointer;
  box-shadow:0 7px 0 var(--ink),0 14px 16px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .06s,box-shadow .06s}
.tile:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.tile.primary{background:var(--sun)}
.tile .ti{font-size:clamp(30px,4vw,46px);line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;animation:icbob 1.8s ease-in-out infinite}
.tile:nth-child(2) .ti{animation-delay:-.4s}.tile:nth-child(3) .ti{animation-delay:-.8s}.tile:nth-child(4) .ti{animation-delay:-1.2s}
.tile b{font-size:clamp(17px,2.1vw,25px);font-weight:900;line-height:1.1}
.tile small{font-size:clamp(11px,1.25vw,14px);font-weight:800;color:var(--mute)}
.tile.primary small{color:#6b5310}
.setup{background:var(--cream);border:4px solid var(--ink);border-radius:28px;box-shadow:0 9px 0 var(--ink),0 18px 22px rgba(0,0,0,.25);padding:18px 26px 20px;width:min(720px,96%);color:var(--ink)}
.setup h2{color:var(--ink);text-shadow:none;margin:0 0 6px;font-size:clamp(22px,2.8vw,32px)}
.setup .label{color:var(--mute);text-shadow:none;margin:12px 0 7px;font-size:12px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{appearance:none;display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:18px;padding:10px 14px;cursor:pointer;
  box-shadow:0 5px 0 var(--ink);opacity:.72}
.mode .ti{font-size:clamp(28px,3.4vw,40px);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.mode b{display:block;font-size:clamp(17px,2vw,23px);font-weight:900;line-height:1.1}
.mode small{display:block;font-size:clamp(11px,1.2vw,13.5px);font-weight:800;color:var(--mute);line-height:1.2;margin-top:2px}
.mode.on{opacity:1;background:var(--sun);transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.mode.on small{color:#6b5310}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 5px 0 var(--ink);background:#fff}
.seg button{appearance:none;border:0;border-right:3px solid var(--ink);background:transparent;color:var(--ink);padding:9px 6px;cursor:pointer;min-height:54px}
.seg button:last-child{border-right:0}
.seg button b{display:block;font-size:clamp(16px,1.9vw,22px);font-weight:900;line-height:1.1}
.seg button small{display:block;font-size:clamp(10.5px,1.15vw,13px);font-weight:800;color:var(--mute)}
.seg button.on{background:var(--sun)}.seg button.on small{color:#6b5310}
.setup .row{margin-top:18px;gap:12px;flex-wrap:nowrap}
.setup .btn.go{flex:1;min-width:0}
.setup .msg{margin-top:10px}
@media (orientation:portrait){
  .menu{grid-template-columns:1fr 1fr;gap:10px;width:min(92vw,440px)}
  .tile{padding:12px 6px 10px;border-radius:18px}
  .setup{padding:14px 14px 16px;border-radius:22px}
  .modes{grid-template-columns:1fr}
  .mode{padding:9px 12px}
}
@media (max-height:640px) and (orientation:landscape){.tile .ti{font-size:26px}.tile{padding:8px 8px}.setup{padding:10px 20px 12px}.setup .label{margin:7px 0 5px}.seg button{min-height:44px;padding:5px}}
.hand.memo{gap:10px}
.card .pic{font-size:clamp(34px,8.5vh,96px)}
@media (orientation:portrait){.card .pic{font-size:clamp(28px,10vw,56px)}}

/* ---- v24: cards are dealt onto the table and move when played ---- */
.hand.predeal .card{visibility:hidden}
.hand.dealing .card{animation:dealin .5s cubic-bezier(.2,.75,.3,1.12) backwards;animation-delay:var(--dd,0ms)}
/* a card cannot be touched while it is still in the air, so a falling card never catches a tap meant for a card below it */
@keyframes dealin{0%{transform:translate(var(--fx,0),-75vh) rotate(var(--fr,-14deg)) scale(.5);opacity:0;pointer-events:none}35%{opacity:1}82%{transform:translate(0,5px) rotate(0) scale(1.03);pointer-events:none}100%{transform:none;opacity:1;pointer-events:auto}}
.card.pend{visibility:hidden}
.card.fxc{position:fixed;z-index:70;margin:0;pointer-events:none;transform-origin:50% 50%;box-shadow:0 10px 0 var(--ink),0 22px 26px rgba(0,0,0,.35);animation:none!important}
.card.fxc .ic{animation:none}
/* never split a word across lines on a hand card: fitCards() shrinks the text instead */
.hand .card{word-break:normal;overflow-wrap:normal}
.hand .card .tx{overflow-wrap:normal}


/* v25: picture avatars, product boxes, word memory, leaderboard avatars */
.av.avi{display:block;border-radius:50%;background-size:cover;background-position:center;border:3px solid var(--ink);box-sizing:border-box;background-color:#fff}
.av.xl.avi{border-width:5px}
/* v27: the result note sits at the top edge and is smaller, so it never covers the cards; it also names the topic */
#toast{top:10px;transform:translate(-50%,-130%);padding:10px 22px;max-width:min(92vw,760px)}
#toast.show{transform:translate(-50%,0)}
#toast b{font-size:clamp(20px,2.6vw,32px)}
#toast span{margin-top:3px;font-size:clamp(14px,1.6vw,19px)}
#toast .tp{display:inline-block;margin-top:6px;padding:2px 12px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:clamp(13px,1.5vw,18px)}
@media (orientation:portrait){#toast{padding:8px 12px}#toast b{font-size:clamp(18px,5.4vw,26px)}#toast span,#toast .tp{font-size:clamp(12px,3.6vw,16px)}}
/* v28: observer ("yönetici") view */
.wbtn{margin-top:14px;font-size:15px;min-height:42px;padding:6px 18px}
.watch{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;padding:12px 14px 58px;color:#fff;overflow:auto}
.wtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-weight:800}
.wt1 b{color:var(--sun)}
.wph{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:3px 16px;font-weight:900}
.wcols{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wcol{min-width:0;display:flex;flex-direction:column;gap:6px;background:rgba(0,0,0,.22);border:3px solid rgba(255,255,255,.25);border-radius:18px;padding:10px}
.wcol.empty{align-items:center;justify-content:center}
.whead{display:flex;align-items:center;gap:10px;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:4px 16px 4px 4px}
.whead .av.sm{width:44px;height:44px}
.wn{flex:1;min-width:0;line-height:1.1}.wn b{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wn small{font-size:12px;color:#b3261e;font-weight:800}
.wtm{font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.wsc{font-weight:900;font-size:30px;min-width:56px;text-align:right}
.wstat{font-size:15px;font-weight:700;opacity:.95}.wstat b{color:var(--sun)}
.wlast{font-size:15px;font-weight:800;min-height:22px;border-radius:10px;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wlast.ok{background:#d9ffe6;color:#0d6b39}.wlast.bad{background:#ffe1dc;color:#b3261e}
.whand{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start;overflow:auto;padding:6px 2px 2px}
.whand.memo{grid-template-columns:repeat(5,1fr)}
.wc{position:relative;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:12px;min-height:54px;padding:8px 6px 6px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:15px;line-height:1.1}
.whand.memo .wc{min-height:62px;font-size:14px}
.wc .pb{position:absolute;left:-7px;top:-9px;min-width:22px;height:22px;border-radius:11px;border:2px solid var(--ink);color:var(--ink);font-style:normal;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 4px}
.wc .pic{font-size:28px;line-height:1}.wc svg{width:38px;height:38px}.wc .pimg{display:block;width:100%;height:46px;background-size:contain;background-repeat:no-repeat;background-position:center}
.wc.dec{background:#efe9df}
.wc.gone{opacity:.32}
.wc.sel{border-color:#f5b800;box-shadow:0 0 0 4px #ffd84a,0 0 18px #ffd84a;transform:translateY(-3px)}
.wnote{position:absolute;left:14px;right:230px;bottom:14px;margin:0;font-size:12px;font-weight:700;color:#fff;opacity:.85}
.obseye{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:40;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:12px;padding:3px 12px;border-radius:999px;pointer-events:none}
@media (orientation:portrait){.wcols{grid-template-columns:1fr}.whand,.whand.memo{grid-template-columns:repeat(3,1fr)}.wnote{position:static}.watch{padding-bottom:70px}}
/* v29: observer cards are large and fill the column; no answer marks; memory cards face down */

/* v30: patterned felt - marks fade out towards the middle of the table, the middle is a little brighter */

/* v34: "Dondur" ices the whole screen; "Yak" burns cards to ash */
#ice{position:fixed;inset:0;z-index:44;pointer-events:none;overflow:hidden;animation:icein .55s cubic-bezier(.2,.8,.3,1) both;

#ice polyline{fill:none;stroke:#eaf8ff;stroke-width:3;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;animation:icecrack .7s .12s ease-out forwards}
#ice i{position:absolute;top:-48px;color:#fff;font-style:normal;line-height:1;will-change:transform;animation:icesnow 2.6s linear infinite}
#ice.melt{transition:opacity .45s ease-in,transform .45s ease-in;opacity:0;transform:scale(1.12)}
@keyframes icein{from{opacity:0;transform:scale(1.3)}60%{opacity:1}to{opacity:1;transform:scale(1)}}
@keyframes icecrack{to{stroke-dashoffset:0}}

body.noanim #ice polyline{stroke-dashoffset:0}body.noanim #ice i{top:30%}
.banner.ice{z-index:46;bottom:auto;top:44%;font-size:clamp(22px,3.4vw,40px);padding:10px 26px;background:#e8f7ff;border-color:#2a6fa8;color:#14507f;box-shadow:0 6px 0 #2a6fa8,0 0 30px rgba(255,255,255,.9)}
.hand.frz .card{filter:none;color:#5c7f9c;background:linear-gradient(160deg,#f3fbff,#cfeaff 60%,#eaf7ff);border-color:#3a7fb8;box-shadow:0 6px 0 #3a7fb8,inset 0 0 14px rgba(255,255,255,.9)}
.card.burning{pointer-events:none;animation:burnup .9s ease-in forwards!important;z-index:3}
.card.burning::after{content:"🔥"!important;display:block!important;position:absolute;left:0;right:0;top:auto;bottom:14%;height:auto;width:auto;max-width:none;aspect-ratio:auto;transform:none;background:none!important;box-shadow:none;border-radius:0;text-align:center;font-size:clamp(34px,6vh,70px);line-height:1;text-shadow:none;animation:flame .18s ease-in-out infinite alternate}
@keyframes burnup{0%{}18%{background-color:#ffb347;border-color:#b33a00;box-shadow:0 0 26px 9px #ff7a00}55%{background-color:#5a2d16;border-color:#2a1208;transform:scale(.97) rotate(-2deg);box-shadow:0 0 30px 10px #ff5a00}100%{background-color:#1c1512;border-color:#000;transform:scale(.5) rotate(7deg);opacity:0;box-shadow:0 0 0 0 #ff5a00}}
.card.burning{background-image:none!important}.card.burning::before{display:none!important}
.card.burning > *{animation:burntext .5s ease-in forwards}

  -webkit-clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,

const ICON_SUBJECT = {fen:"🧪", mat:"🔢", tur:"💬", sos:"🗺️", ing:"🔤"};
const iconCache = {};
function iconFor(text, subj){
  const k = subj + "|" + text; if(iconCache[k]) return iconCache[k];
  const t = low(text); let ic = "";
  for(const [ph, e] of ICON_PHRASES){ if(t.indexOf(ph) >= 0){ ic = e; break; } }
  if(!ic){ if(/\b\d{3,4}\b/.test(t)) ic = "📅"; }
  if(!ic){ for(const w of t.split(/[\s(),.?!·+]+/)){ if(Object.prototype.hasOwnProperty.call(ICON_WORDS, w)){ ic = ICON_WORDS[w]; break; } } }
  if(!ic && /savaşı|muharebesi|cephesi|taarruz/.test(t)) ic = "⚔️";
  if(!ic && /antlaşması|sözleşmesi|fermanı|kanunu|madde/.test(t)) ic = "📜";
  if(!ic && /açı|°/.test(t)) ic = "📐";
  return (iconCache[k] = ic || ICON_SUBJECT[subj] || "⭐");
}
// ---------- QR code: the second tablet scans it with its camera and lands in this room ----------
const joinUrl = code => location.origin + location.pathname + "?oda=" + code;
const qrCache = {};
function qrSvg(code){
  if(!/^https?:$/.test(location.protocol) || typeof qrcode !== "function") return ""; // a file opened from disk has no address to share
  if(!qrCache[code]){ try{ const q = qrcode(0, "M"); q.addData(joinUrl(code)); q.make(); qrCache[code] = q.createSvgTag({cellSize:6, margin:2, scalable:true}); }catch(e){ qrCache[code] = ""; } }
  return qrCache[code];
}

// ---------- dealing ----------
// Picks D.pairs combinations of one subject for one hand: no two cards with the same text,
// and never two rows of the same group (their cards could also be combined with each other).
function pickHand(subj, used, D){
  const usedSet = new Set(used), all = [];
  COMBOS.forEach((c,i) => { if(c[0] === subj && D.levels.indexOf(c[1]) >= 0) all.push(i); });
  const tryPick = cands => {
    const texts = new Set(), groups = new Set(), out = [];
    for(const i of cands){
      if(out.length >= D.pairs) break;

// ---------- sync layer: Firebase or BroadcastChannel (local test) ----------
function LocalStore(){
  // Local test mode: IndexedDB gives atomic cross-tab transactions, BroadcastChannel notifies the other tab.
  const bc = new BroadcastChannel("bk_sync"), subs = {};
  const dbp = new Promise((res, rej) => { const r = indexedDB.open("bk_local", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("rooms"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const run = (mode, fn) => dbp.then(db => new Promise((res, rej) => {
    const t = db.transaction("rooms", mode), st = t.objectStore("rooms"); let out;
    fn(st, v => { out = v; }); t.oncomplete = () => res(out); t.onerror = t.onabort = () => rej(t.error); }));
  const read = c => run("readonly", (st, done) => { const q = st.get(c); q.onsuccess = () => done(q.result || null); });
  const fire = c => read(c).then(v => (subs[c]||[]).forEach(f => f(v)));
  const tx = (c, fn) => run("readwrite", (st, done) => { const q = st.get(c); q.onsuccess = () => {
      const cur = q.result || null; let next; try{ next = fn(cur); }catch(e){ next = undefined; }
      if(next === undefined){ done({ok:false, val:cur}); return; }
      if(next === null) st.delete(c); else st.put(next, c);
      done({ok:true, val:next}); }; })
    .then(r => { if(r.ok){ bc.postMessage({c}); fire(c); } return r; });
  const setOn = (c, role, on) => tx(c, s => { if(!s || !s.players || !s.players[role]) return; s.players[role].on = on; if(!on) s.players[role].off = Date.now(); return s; });
  // write one value somewhere inside the room (null removes it)
  const put = (c, path, val) => tx(c, s => { if(!s) return; const ks = path.split("/"); let o = s;
    for(let i=0;i<ks.length-1;i++) o = o[ks[i]] = o[ks[i]] || {};
    if(val === null) delete o[ks[ks.length-1]]; else o[ks[ks.length-1]] = val; return s; }).catch(() => {});
  bc.onmessage = e => { const m = e.data || {}; if(m.bye) setOn(m.c, m.bye, false); else if(m.byeObs) put(m.c, "obs/" + m.byeObs, null); else if(m.c) fire(m.c); };
  return {
    local:true, now:() => Date.now(), tx, put,
    observe:(c, id) => { put(c, "obs/" + id, true); const h = () => bc.postMessage({c, byeObs:id});
      window.addEventListener("pagehide", h); return () => { window.removeEventListener("pagehide", h); put(c, "obs/" + id, null); }; },
    stamp:(c, field) => tx(c, s => { if(!s) return; s[field] = Date.now(); return s; }),
    watch:(c, f) => { (subs[c] = subs[c]||[]).push(f); read(c).then(f); return () => { subs[c] = (subs[c]||[]).filter(x => x!==f); }; },
    presence:(c, role) => { setOn(c, role, true); const h = () => bc.postMessage({c, bye:role}); // the surviving tab records the drop

    cleanup:() => run("readwrite", st => { const q = st.openCursor(); q.onsuccess = () => { const cu = q.result; if(!cu) return;
      if(!cu.value || !cu.value.created || cu.value.created < Date.now() - ROOM_TTL_MS) cu.delete(); cu.continue(); }; }).catch(() => {}),
    addRecord:async r => { const l = JSON.parse(localStorage.getItem("bk_records")||"[]"); l.push(Object.assign({d:Date.now()}, r));

    topRecords:async () => JSON.parse(localStorage.getItem("bk_records")||"[]")
